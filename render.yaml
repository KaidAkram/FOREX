# Render Blueprint for ShiftFX (100% Free Tier, Zero Cost)
services:
  - type: web
    name: shiftfx-admin
    runtime: node
    plan: free
    buildCommand: cd fx-macro-bias/frontend && npm ci --include=dev && npm run build
    startCommand: cd fx-macro-bias/frontend && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: BACKEND_INTERNAL_URL
        value: https://shiftfx-backend.onrender.com

  - type: web
    name: shiftfx-backend
    runtime: python
    plan: free
    buildCommand: cd fx-macro-bias/backend && pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: cd fx-macro-bias/backend && python manage.py migrate --noinput && python manage.py bootstrap_macro --continuous
    startCommand: cd fx-macro-bias/backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "false"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com,.shiftfx.io,shiftfx-backend
      - key: CORS_ALLOWED_ORIGINS
        value: https://shiftfx.io,https://terminal.shiftfx.io,https://admin.shiftfx.io
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://shiftfx.io,https://terminal.shiftfx.io,https://admin.shiftfx.io
