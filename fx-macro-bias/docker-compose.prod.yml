# ==============================================================================
# ShiftFX Production Docker Compose Orchestrator
# Complete Zero-Trust Defense-in-Depth Architecture
# ==============================================================================

version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # Edge Reverse Proxy & TLS Termination
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: shiftfx_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/shiftfx/staticfiles:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - shiftfx_public
      - shiftfx_backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Next.js 14 Production Frontend (Non-Root, Standalone)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiftfx_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - shiftfx_public
      - shiftfx_backend
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Django 5 REST Backend (Gunicorn, Non-Root)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftfx_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-strong_redis_pwd}@redis:6379/1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiftfx_backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/macro/dashboard/"]
      interval: 25s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # Secure PostgreSQL 16 Database (Isolated Backend Network)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shiftfx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shiftfx_prod}
      POSTGRES_USER: ${DB_USER:-shiftfx_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shiftfx_backend
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shiftfx_admin} -d ${DB_NAME:-shiftfx_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Redis Cache & Throttling Store (Password Protected)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shiftfx_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-strong_redis_pwd}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - shiftfx_backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-strong_redis_pwd}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ------------------------------------------------------------------------------
# Isolated Docker Networks & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  shiftfx_public:
    driver: bridge
  shiftfx_backend:
    internal: true
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_www:
